apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      containers:
        - name: navidrome
          image: deluan/navidrome:latest
          ports:
            - containerPort: 4533
          env:
            - name: ND_SCANSCHEDULE
              value: "1h"
            - name: ND_LOGLEVEL
              value: "info"
          volumeMounts:
            - name: navidrome-data
              mountPath: /data
            - name: music
              mountPath: /music
      volumes:
        - name: navidrome-data
          hostPath:
            path: path_to_navidrome_data
            type: Directory
        - name: music
          hostPath:
            path: "hdd_path"
            type: Directory
